name: Update Scholar Citations (gh-pages)

# Fetches Google Scholar stats and writes assets/json/citations.json directly on
# the gh-pages branch (the static site actually served). The homepage reads that
# JSON at runtime via assets/js/citations.js, so no Jekyll rebuild is required.
#
# NOTE: the scheduled run is DISABLED. Google Scholar only serves residential
# IPs, so fetching from GitHub Actions fails (free proxies get blocked, and a
# free-tier ScraperAPI key returns HTTP 503). Left as manual-only so it doesn't
# fail on a cron and spam notifications. To re-enable automatic updates you need
# a residential/premium proxy (e.g. a paid ScraperAPI plan), then uncomment the
# schedule below. citations.json can also just be edited by hand.

on:
  # schedule:
  #   - cron: "0 0 * * 1" # Monday
  #   - cron: "0 0 * * 3" # Wednesday
  #   - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin transitive deps to versions scholarly 1.7.11 was written against:
          #  - free-proxy==1.0.2: get_proxy_list(self) has no `repeat` arg, so
          #    scholarly's get_proxy_list(repeat=False) raises TypeError and is
          #    caught by its except -> falls back to the no-arg call. free-proxy
          #    >=1.1.0 made `repeat` positional, which breaks that fallback path.
          #  - httpx[socks]<0.28: newer httpx breaks scholarly's fetches; the
          #    socks extra is required because scholarly uses a SOCKS proxy.
          pip install "scholarly" "free-proxy==1.0.2" "httpx[socks]<0.28"

      - name: Save current citations.json hash
        id: before
        run: |
          if [ -f assets/json/citations.json ]; then
            echo "sha=$(sha256sum assets/json/citations.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "sha=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Run citation update script
        shell: bash
        run: |
          set +e
          timeout 300 python bin/update_citations_json.py
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::Citation update failed (exit $status); existing JSON kept."
          fi
          set -e

      - name: Save new citations.json hash
        id: after
        run: |
          if [ -f assets/json/citations.json ]; then
            echo "sha=$(sha256sum assets/json/citations.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "sha=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.before.outputs.sha != steps.after.outputs.sha
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add assets/json/citations.json
          git commit -m "Update Google Scholar citations"
          git push
